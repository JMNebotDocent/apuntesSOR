site_name: Sistemas Operativos en Red
site_description: Apuntes y prácticas de Sistemas Operativos en Red
site_author: JMNebotDocent
site_url: https://JMNebotDocent.github.io/apuntesSOR/

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate # Muy útil para explicar líneas específicas de scripts o configs

markdown_extensions:
  - admonition               # Cajas de notas, advertencias y avisos (!!! note / !!! warning)
  - pymdownx.details          # Permite desplegables ocultos (??? note)
  - pymdownx.superfences      # Bloques de código avanzados y anidados
  - pymdownx.highlight:       # Resaltado de sintaxis
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite     # Resaltar comandos o rutas en línea (`code`)
  - pymdownx.snippets         # Reutilizar fragmentos de texto o configuraciones
  - tables                    # Tablas Markdown

nav:
  - Inicio: index.md